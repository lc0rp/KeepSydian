name: Sync attempt candidate verification
on:
  push:
    branches: [fix/sync-attempt-observability]
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply loopback verification update
        run: |
          set -euo pipefail
          echo 'dcdda8df343cf8415f2ff074b2044fff1e26c51c928c56c453eb6e14585b6f6e  .github/sync-attempt-loopback.patch' | sha256sum -c
          git apply --index .github/sync-attempt-loopback.patch
          git config user.name 'KeepSidian validation'
          git config user.email 'noreply@users.noreply.github.com'
          git commit -m 'test: verify sync failures through real Obsidian HTTP'
          git push origin HEAD:refs/heads/validation/sync-attempt-${{ github.run_id }}
          mkdir -p test-results
          git rev-parse HEAD > test-results/candidate-commit.txt
          git rev-parse HEAD^{tree} > test-results/candidate-tree.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test -- --runInBand 2>&1 | tee test-results/unit.log
      - run: npm run coverage -- --runInBand 2>&1 | tee test-results/coverage.log
      - run: npm run lint 2>&1 | tee test-results/lint.log
      - run: npm run build 2>&1 | tee test-results/build.log
      - name: Installed Obsidian desktop end-to-end verification
        run: xvfb-run -a npm run wdio 2>&1 | tee test-results/desktop.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-attempt-verification
          path: |
            coverage
            test-results
          if-no-files-found: ignore
          retention-days: 3
