name: Sync attempt candidate verification
on:
  push:
    branches: [fix/sync-attempt-observability]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply checksum-verified implementation
        run: |
          set -euo pipefail
          cat .github/sync-attempt-transfer/part* | base64 -d | gzip -d > /tmp/sync-attempt.patch
          echo 'c02a43920fd975aa8238b99bc85b693eb06df2cdd034d1c7559c8ce88263bc6b  /tmp/sync-attempt.patch' | sha256sum -c
          git apply --index /tmp/sync-attempt.patch
          git config user.name 'KeepSidian validation'
          git config user.email 'noreply@users.noreply.github.com'
          git commit -m 'fix: persist sync attempts across preparation and execution'
          git push origin HEAD:refs/heads/validation/sync-attempt-${{ github.run_id }}
          mkdir -p test-results
          git rev-parse HEAD > test-results/candidate-commit.txt
          git rev-parse HEAD^{tree} > test-results/candidate-tree.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test -- --runInBand 2>&1 | tee test-results/unit.log
      - run: npm run coverage -- --runInBand 2>&1 | tee test-results/coverage.log
      - run: npm run lint 2>&1 | tee test-results/lint.log
      - run: npm run build 2>&1 | tee test-results/build.log
      - name: Installed Obsidian desktop end-to-end verification
        run: xvfb-run -a npm run wdio 2>&1 | tee test-results/desktop.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-attempt-verification
          path: |
            coverage
            test-results
          if-no-files-found: ignore
          retention-days: 3
