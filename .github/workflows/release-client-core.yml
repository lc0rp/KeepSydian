name: Build and publish reviewed beta.8 after server verification
on:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: keepsidian-client-hosted-release
  cancel-in-progress: false
jobs:
  build:
    if: github.repository_id == '822100323' && github.actor_id == '2609441' && github.triggering_actor == 'lc0rp' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: write
      id-token: write
    outputs:
      artifact_id: ${{ steps.release-assets.outputs.artifact-id }}
    env:
      KEEPSIDIAN_SERVER_URL: https://v2-1-0-beta-8---keepsidianserver-i55qr5tvea-uc.a.run.app
      KEEPSIDIAN_RECOVERY_UAT: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0e07e1b12a994ec2a80edf72bc1db847d70a3049
          persist-credentials: false
      - name: Verify frozen source and offline publication contracts
        run: |
          test "$(git rev-parse HEAD)" = '0e07e1b12a994ec2a80edf72bc1db847d70a3049'
          python3 -B scripts/test_hosted_release_beta8.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.x"
      - name: Install locked dependencies and build exact beta.8 URL
        run: |
          cutoff="$(python3 -c 'from datetime import datetime, timedelta, timezone; print((datetime.now(timezone.utc) - timedelta(days=14)).strftime("%Y-%m-%dT%H:%M:%SZ"))')"
          npm ci --before="$cutoff"
          node --test scripts/release-version.test.mjs
          npm run build
          python3 - <<'PYVERIFY'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('release', 'scripts/hosted-release-beta8.py')
          release = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(release)
          release.validate(Path.cwd())
          PYVERIFY
      - name: Attest the three built assets
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - id: release-assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keepsidian-beta8-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
          retention-days: 1
  publish:
    if: github.repository_id == '822100323' && github.actor_id == '2609441' && github.triggering_actor == 'lc0rp' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0e07e1b12a994ec2a80edf72bc1db847d70a3049
          persist-credentials: false
      - name: Require the successful build's single artifact ID
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        run: |
          python3 - <<'PYVERIFY'
          import os, re
          if not re.fullmatch(r'[1-9][0-9]*', os.environ['ARTIFACT_ID']):
              raise RuntimeError('A single successful build artifact ID is required')
          PYVERIFY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          merge-multiple: true
          path: .
      # Orchestrator dispatches only after backend success + fresh live metadata.
      # Public capability checks prove routing, not model/image identity.
      - name: Recheck tagged routing and reconcile prerelease by canonical ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/hosted-release-beta8.py publish --source 0e07e1b12a994ec2a80edf72bc1db847d70a3049
          cat release-receipt.json >> "$GITHUB_STEP_SUMMARY"
      - name: Retain publication intent/receipt even after an ambiguous failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keepsidian-beta8-client-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-intent.json
            release-receipt.json
          if-no-files-found: warn
          retention-days: 1
