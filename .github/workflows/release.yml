name: Release Keepsidian plugin

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag matching the plugin manifest version
        required: true
        type: string
      server_url:
        description: Optional public API endpoint for this build
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      RELEASE_SERVER_URL: ${{ inputs.server_url || vars.KEEPSIDIAN_SERVER_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.x"
          cache: npm
      - name: Validate release identity
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { parseVersion } from './scripts/release-version.mjs';
          const manifest = JSON.parse(readFileSync('manifest.json', 'utf8'));
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          parseVersion(manifest.version);
          assert.equal(process.env.RELEASE_TAG, manifest.version, 'Obsidian release tags must match the manifest version without a prefix.');
          assert.equal(pkg.version, manifest.version);
          JS
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - name: Install locked dependencies
        run: |
          cutoff="$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          npm ci --before="$cutoff"
      - name: Run self-contained tests
        run: npm test
      - name: Build plugin
        run: |
          if [ -n "$RELEASE_SERVER_URL" ]; then export KEEPSIDIAN_SERVER_URL="$RELEASE_SERVER_URL"; fi
          npm run build
      - name: Attest release assets
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--draft --verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}" main.js manifest.json styles.css
