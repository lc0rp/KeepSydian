name: Map verified backend then build and publish client
on:
  workflow_call:
    inputs:
      client_tag:
        type: string
        default: ""
      server_tag:
        type: string
        default: ""
      build_id:
        type: string
        default: ""
      fault_stage:
        type: string
        default: ""
      recovery_run:
        type: string
        default: ""
      recovery_artifact:
        type: string
        default: ""
      recovery_head:
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: keepsidian-client-hosted-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository_id == '822100323' && github.actor_id == '2609441' && github.triggering_actor == 'lc0rp' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      KEEPSIDIAN_NATIVE_SELECTION: ${{ github.workspace }}/selection.json
      KEEPSIDIAN_MAPPING_RECEIPT: ${{ github.workspace }}/mapping.json
      KEEPSIDIAN_RECOVERY_UAT: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: c66ea471066eb4507a1c0a48aefd304d18572ea1
          path: engine
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: policy
          sparse-checkout: release/cloud-release-policy.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Resolve external client tag and require enabled approved policy
        id: selected
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_TAG: ${{ inputs.client_tag }}
          SERVER_TAG: ${{ inputs.server_tag }}
          BUILD_ID: ${{ inputs.build_id }}
          FAULT_STAGE: ${{ inputs.fault_stage }}
          ORIGIN_RUN: ${{ inputs.recovery_run }}
          ORIGIN_ARTIFACT: ${{ inputs.recovery_artifact }}
          ORIGIN_HEAD: ${{ inputs.recovery_head }}
        run: |
          python3 - <<'PYINPUT'
          import os, re
          if os.environ['FAULT_STAGE'] not in ('', 'after-attestation'): raise RuntimeError('Unapproved E2E fault')
          values=[os.environ[k] for k in ('ORIGIN_RUN','ORIGIN_ARTIFACT','ORIGIN_HEAD')]
          if any(values) and not (re.fullmatch(r'[1-9][0-9]*',values[0]) and re.fullmatch(r'[1-9][0-9]*',values[1]) and re.fullmatch(r'[0-9a-f]{40}',values[2])):
              raise RuntimeError('Complete exact recovery tuple required')
          PYINPUT
          python3 engine/scripts/native_client_selection.py --policy policy/release/cloud-release-policy.json --client-tag "$CLIENT_TAG" --server-tag "$SERVER_TAG" --build-id "$BUILD_ID" --output selection.json >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.selected.outputs.client_source }}
          path: app
          persist-credentials: false
      - name: Restore exact artifact without rebuilding
        if: inputs.recovery_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN_RUN: ${{ inputs.recovery_run }}
          ORIGIN_ARTIFACT: ${{ inputs.recovery_artifact }}
          ORIGIN_HEAD: ${{ inputs.recovery_head }}
        run: |
          core="$(python3 -c 'import json,re; p=json.load(open("policy/release/cloud-release-policy.json")); c=p.get("recovery_core",""); assert re.fullmatch("[0-9a-f]{40}",c); print(c)')"
          python3 engine/scripts/restore_release_artifact.py --repo lc0rp/KeepSydian --run-id "$ORIGIN_RUN" --artifact-id "$ORIGIN_ARTIFACT" --head "$ORIGIN_HEAD" --core lc0rp/KeepSydian/.github/workflows/release-client-cloud-core.yml@"$core" --prefix keepsidian-native-client --destination recovered --required main.js --required manifest.json --required styles.css --required release-build.json --allowed main.js --allowed manifest.json --allowed styles.css --allowed release-build.json --allowed release-intent.json --allowed release-receipt.json --allowed release-command-error.json
          cp recovered/main.js recovered/manifest.json recovered/styles.css recovered/release-build.json app/
          if [ -f recovered/release-intent.json ]; then cp recovered/release-intent.json app/; fi
          python3 - <<'PYVERIFY'
          import sys, importlib.util
          from pathlib import Path
          sys.path.insert(0,str(Path('engine/scripts').resolve()))
          s=importlib.util.spec_from_file_location('publisher','engine/scripts/hosted-release-beta8.py')
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m)
          m.verify_build(Path('app'),m.PLAN['client_source'],m.validate(Path('app')))
          PYVERIFY
      - id: mapping-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/162887264002/locations/global/workloadIdentityPools/keepsidian-client-release/providers/github-client-main
          service_account: keepsidian-client-mapper@lc0rp-labs.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify native backend and map client alias before building
        env:
          ACCESS_TOKEN: ${{ steps.mapping-auth.outputs.access_token }}
          CLIENT_TAG: ${{ inputs.client_tag }}
          SERVER_TAG: ${{ inputs.server_tag }}
          BUILD_ID: ${{ inputs.build_id }}
        run: python3 engine/scripts/native_cloud_release.py --policy policy/release/cloud-release-policy.json --client-tag "$CLIENT_TAG" --server-tag "$SERVER_TAG" --build-id "$BUILD_ID" --receipt mapping.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: inputs.recovery_run == ''
        with:
          node-version: '22.x'
      - name: Build only after verified mapping
        if: inputs.recovery_run == ''
        working-directory: app
        env:
          KEEPSIDIAN_SERVER_URL: ${{ steps.selected.outputs.backend }}
        run: |
          cutoff="$(python3 -c 'from datetime import datetime,timedelta,timezone; print((datetime.now(timezone.utc)-timedelta(days=14)).strftime("%Y-%m-%dT%H:%M:%SZ"))')"
          npm ci --before="$cutoff"
          npm run build
          python3 - <<'PYBUILD'
          import sys, importlib.util
          from pathlib import Path
          sys.path.insert(0,str(Path('../engine/scripts').resolve()))
          s=importlib.util.spec_from_file_location('publisher','../engine/scripts/hosted-release-beta8.py')
          m=importlib.util.module_from_spec(s);s.loader.exec_module(m);m.record_build(Path.cwd())
          PYBUILD
      - uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35
        if: inputs.recovery_run == ''
        with:
          subject-path: |
            app/main.js
            app/manifest.json
            app/styles.css
      - name: Controlled E2E partial failure retaining exact attested bytes
        if: inputs.fault_stage == 'after-attestation'
        run: |
          echo 'Intentional E2E fault after build and attestation; recover the retained exact artifact.'
          exit 1
      - id: recheck-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/162887264002/locations/global/workloadIdentityPools/keepsidian-client-release/providers/github-client-main
          service_account: keepsidian-client-mapper@lc0rp-labs.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 900s
          create_credentials_file: false
          export_environment_variables: false
      - name: Independently reverify mapping and publish exact built bytes
        env:
          ACCESS_TOKEN: ${{ steps.recheck-auth.outputs.access_token }}
          GH_TOKEN: ${{ github.token }}
          CLIENT_TAG: ${{ inputs.client_tag }}
          SERVER_TAG: ${{ inputs.server_tag }}
          BUILD_ID: ${{ inputs.build_id }}
          SOURCE: ${{ steps.selected.outputs.client_source }}
        run: |
          python3 engine/scripts/native_cloud_release.py --policy policy/release/cloud-release-policy.json --client-tag "$CLIENT_TAG" --server-tag "$SERVER_TAG" --build-id "$BUILD_ID" --receipt mapping.json
          cd app
          env -u ACCESS_TOKEN python3 ../engine/scripts/hosted-release-beta8.py publish --source "$SOURCE"
      - name: Retain exact build and publication recovery bytes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: keepsidian-native-client-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/main.js
            app/manifest.json
            app/styles.css
            app/release-build.json
            app/release-intent.json
            app/release-receipt.json
            app/release-command-error.json
          if-no-files-found: warn
          retention-days: 30
