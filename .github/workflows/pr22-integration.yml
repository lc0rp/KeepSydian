name: PR 22 pinned integration

on:
  push:
    branches: ["c2c/merge-actions-20260922"]
    paths: [".github/workflows/pr22-integration.yml"]

permissions:
  contents: write

jobs:
  integrate:
    if: github.repository == 'lc0rp/KeepSydian'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORIGINAL: 35cc1c778f170ce5df8406d97b92feb3869dadb6
      BASE: db2c42e834b6cea1e9d4fc11a036b37d185273cd
      MAIN: f58c0a5b9b54dc80742c83d3da4bf39205b6553f
      EXPECTED_TREE: c3eafae5bfa604b24ec9d22b31adc32fd026fb0f
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct the reviewed three-way merge
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only "$ORIGINAL" HEAD)" = .github/workflows/pr22-integration.yml
          test "$(git rev-parse origin/main)" = "$MAIN"
          test "$(git merge-base "$ORIGINAL" "$MAIN")" = "$BASE"
          mkdir -p "$RUNNER_TEMP/pr22-evidence"
          python - <<'PY'
          import base64, hashlib, os, pathlib, re, subprocess, tempfile, zlib
          root = pathlib.Path.cwd()
          def tree(ref):
              result = {}
              for record in subprocess.check_output(['git', 'ls-tree', '-rz', ref]).split(b'\0'):
                  if not record:
                      continue
                  info, path = record.split(b'\t', 1)
                  mode, kind, sha = info.decode().split()
                  assert kind == 'blob', (path, kind)
                  result[path.decode()] = (mode, sha)
              return result
          refs = [os.environ[name] for name in ['BASE', 'ORIGINAL', 'MAIN']]
          trees = [tree(ref) for ref in refs]
          conflicts = []
          for path in sorted(set().union(*(set(t) for t in trees))):
              values = [subprocess.check_output(['git', 'cat-file', 'blob', t[path][1]]) if path in t else None for t in trees]
              b, h, m = values
              if h == m or m == b:
                  output, selected = h, trees[1]
              elif h == b:
                  output, selected = m, trees[2]
              else:
                  assert all(v is not None for v in values), path
                  with tempfile.TemporaryDirectory() as directory:
                      sources = [pathlib.Path(directory) / name for name in ['base', 'head', 'main']]
                      for target, value in zip(sources, values):
                          target.write_bytes(value)
                      result = subprocess.run(['git', 'merge-file', '-p', '-L', 'PR22', '-L', 'BASE', '-L', 'MAIN', str(sources[1]), str(sources[0]), str(sources[2])], capture_output=True)
                      assert 0 <= result.returncode < 128, (path, result.stderr)
                      if result.returncode:
                          conflicts.append(path)
                      output, selected = result.stdout, trees[1]
              target = root / path
              if output is None:
                  target.unlink(missing_ok=True)
              else:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(output)
                  target.chmod(0o755 if selected[path][0] == '100755' else 0o644)
          assert conflicts == ['.github/workflows/ci.yml', 'src/features/keep/sync.ts', 'src/ui/modals/SyncProgressModal.ts'], conflicts
          print('Resolved conflict paths:', conflicts)
          # Read only the reviewed patch data from the immutable preparation commit.
          previous = subprocess.check_output(['git', 'show', '5de4f7eb07653f8a78952b6bf7c01918b9f18db1:.github/workflows/pr22-integration.yml']).decode()
          payload = re.search(r"payload = '''([A-Za-z0-9+/=]+)'''", previous).group(1)
          patch = zlib.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest() == 'b136ebbdd1c61dfd60637de70276951d39a0f0bd962996f9cc71bf0f86031ab0'
          patch_path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'resolution.patch'
          patch_path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', str(patch_path)], check=True)
          subprocess.run(['git', 'apply', str(patch_path)], check=True)
          # The archive-only case must finish successfully without an empty upload review.
          test_path = root / 'src/features/keep/tests/archive-identity-upload.test.ts'
          text = test_path.read_text()
          old = '\t\texpect(result.nextPlan?.stage).toBe("upload");\n\t\texpect(result.nextPlan?.plan.entries.filter((entry) => entry.selectable)).toHaveLength(0);'
          new = '\t\t// A metadata-only download finishes immediately when there is no upload work.\n\t\texpect(result).toEqual({});\n\t\texpect(plan?.attempt?.outcome).toBe("success");\n\t\texpect(plugin.settings.keepSidianLastSuccessfulSyncDate).toBe(plan?.completionDate);'
          assert text.count(old) == 1
          test_path.write_text(text.replace(old, new))
          (root / '.github/workflows/pr22-integration.yml').unlink()
          PY
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          MERGED_SHA=$(printf '%s\n' 'Merge latest main into PR 22; preserve archive, date-range and merge safeguards' | git commit-tree "$EXPECTED_TREE" -p "$GITHUB_SHA" -p "$MAIN")
          git reset --hard "$MERGED_SHA"
          echo "MERGED_SHA=$MERGED_SHA" >> "$GITHUB_ENV"
          printf 'head=%s\nmain=%s\ntree=%s\n' "$MERGED_SHA" "$MAIN" "$EXPECTED_TREE" | tee "$RUNNER_TEMP/pr22-evidence/revision.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          npm ci > "$RUNNER_TEMP/pr22-evidence/install.log" 2>&1 || { tail -80 "$RUNNER_TEMP/pr22-evidence/install.log"; exit 1; }
      - name: Test the exact merged revision
        shell: bash
        run: |
          git rev-parse HEAD
          npm run coverage > "$RUNNER_TEMP/pr22-evidence/coverage.log" 2>&1 || { tail -160 "$RUNNER_TEMP/pr22-evidence/coverage.log"; exit 1; }
          tail -8 "$RUNNER_TEMP/pr22-evidence/coverage.log"
      - name: Build the exact merged revision
        shell: bash
        run: |
          git rev-parse HEAD
          npm run build > "$RUNNER_TEMP/pr22-evidence/build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/pr22-evidence/build.log"; exit 1; }
          tail -25 "$RUNNER_TEMP/pr22-evidence/build.log"
          git diff --exit-code
          test "$(git write-tree)" = "$EXPECTED_TREE"
      - name: Publish only to the unchanged PR branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN"
          test "$(git ls-remote origin refs/heads/c2c/merge-actions-20260922 | cut -f1)" = "$GITHUB_SHA"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "$MERGED_SHA:refs/heads/c2c/merge-actions-20260922"
          echo "Published $MERGED_SHA with main $MAIN" | tee "$RUNNER_TEMP/pr22-evidence/published.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr22-integration-evidence
          path: ${{ runner.temp }}/pr22-evidence/
          if-no-files-found: warn
          retention-days: 3
