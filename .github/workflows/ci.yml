name: Plugin CI

on:
  workflow_call:
  push:
    branches: [main, develop, "c2c/**", "codex/**"]
    tags-ignore: ["*"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: keepsidian-plugin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify selected revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.x"
          cache: npm
      - name: Install locked dependencies
        run: |
          cutoff="$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          npm ci --before="$cutoff"
      - name: Run offline and unit tests with coverage
        run: npm run coverage
      - name: Build plugin
        run: npm run build
      - name: Retain coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugin-coverage-${{ github.run_id }}
          path: .tmp/coverage
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - name: Retain build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugin-build-${{ github.run_id }}
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
          retention-days: 1
