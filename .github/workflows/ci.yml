name: Plugin CI

on:
  workflow_call:
  push:
    branches: [main, develop, "c2c/**"]
    tags-ignore:
      - "*"
  pull_request:
    branches: [main, develop]

concurrency:
  group: keepsidian-plugin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify built revision
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Built revision: $EXPECTED_SHA"

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
          cache: npm

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keepsidian-plugin-build-${{ github.run_id }}
          path: |
            ./main.js
            ./manifest.json
            ./styles.css
          if-no-files-found: error
          retention-days: 1
