name: Offline regression tools
on:
  push:
    branches: [fix/sync-attempt-observability]
    paths: [.github/workflows/sync-attempt-tools.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: tar --exclude=node_modules/electron/dist -czf /tmp/keepsidian-tools.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: keepsidian-tools
          path: /tmp/keepsidian-tools.tar.gz
          retention-days: 1
