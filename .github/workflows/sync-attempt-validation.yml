name: Sync attempt validation

on:
  push:
    branches: [fix/sync-attempt-observability]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Package source for isolated review
        run: git archive --format=tar.gz -o /tmp/keepsidian-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: keepsidian-source
          path: /tmp/keepsidian-source.tar.gz
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test -- --runInBand
      - run: npm run coverage -- --runInBand
      - run: npm run lint
      - run: npm run build
      - name: Desktop end-to-end verification
        run: xvfb-run -a npm run wdio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keepsidian-validation
          path: |
            coverage
            test-results
            wdio-logs
          if-no-files-found: ignore
          retention-days: 1
